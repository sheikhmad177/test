<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOOVEŔ — Maison de Parfum | Official Online Boutique</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d0b09'/><text x='16' y='21' font-family='Georgia,serif' font-size='13' fill='%23d4af37' text-anchor='middle'>SO</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ws-bg: #111318;
      --app-bg: #faf8f5;
      --surface: #ffffff;
      --surface-alt: #f3efe9;
      --ink: #14110e;
      --ink-2: #5c564f;
      --ink-3: #8c857b;
      --line: #e6e0d6;
      --line-2: #efeae2;
      --gold: #b48e55;
      --gold-dark: #8f6d38;
      --gold-soft: #e5d3b3;
      --danger: #c92a2a;
      --danger-bg: #fff5f5;
      --success: #1b7a43;
      --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--app-bg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

    /* ---------------- Researcher Toolbar ---------------- */
    .toolbar {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 10px 24px; background: #12151b;
      border-bottom: 1px solid rgba(255,255,255,.08);
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 7px; background: #000; color: var(--gold-soft);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-weight: 700; font-size: 13px;
      border: 1px solid var(--gold);
    }
    .brand-name { font-family: var(--serif); font-weight: 600; letter-spacing: 2px; font-size: 14px; color: #f4f1ec; }
    .brand-sub { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: #8b9099; }
    .sync-pill {
      font-size: 11px; color: #6ee7b7; background: rgba(16,185,129,.12);
      border: 1px solid rgba(16,185,129,.3); padding: 4px 10px; border-radius: 20px;
    }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .tab {
      border: 1px solid rgba(255,255,255,.14); background: transparent; color: #c7ccd4;
      padding: 7px 13px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer;
      transition: .15s;
    }
    .tab:hover { border-color: rgba(255,255,255,.35); color: #fff; }
    .tab.active { background: #fff; color: #14110e; border-color: #fff; font-weight: 600; }
    .inspector { display: flex; align-items: center; gap: 8px; color: #c7ccd4; font-size: 12px; }
    .inspector-label { letter-spacing: .5px; text-transform: uppercase; font-size: 10px; color: #8b9099; }
    .switch { width: 42px; height: 22px; border-radius: 12px; background: #3a3f47; position: relative; cursor: pointer; transition: .2s; border: none; padding: 0; }
    .switch.on { background: var(--gold); }
    .switch .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .2s; }
    .switch.on .knob { left: 22px; }
    .inspector-state { font-weight: 600; min-width: 24px; color: #fff; }

    .task-banner {
      display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 20px; background: #1e222b; color: #f0ece4;
      border-bottom: 1px solid rgba(180,142,85,.35); font-size: 13px;
    }
    .task-tag {
      font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
      color: #14110e; background: var(--gold-soft); padding: 4px 8px; border-radius: 4px;
    }

    /* ---------------- Storefront Layout ---------------- */
    .announce-bar {
      background: #14110e; color: #e8e2d9; text-align: center;
      padding: 9px 16px; font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase;
    }
    .announce-bar b { color: var(--gold-soft); font-weight: 600; }

    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(250, 248, 245, 0.94); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      max-width: 1180px; margin: 0 auto; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .site-brand {
      display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; color: inherit;
    }
    .site-logo {
      width: 40px; height: 40px; border-radius: 8px; background: #14110e; color: var(--gold-soft);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-weight: 700; font-size: 16px; letter-spacing: 1px;
      border: 1px solid var(--gold);
    }
    .site-name-wrap { display: flex; flex-direction: column; }
    .site-name { font-family: var(--serif); font-size: 22px; letter-spacing: 4px; font-weight: 700; line-height: 1.1; }
    .site-tagline { font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-dark); margin-top: 2px; }

    .site-nav { display: flex; align-items: center; gap: 28px; }
    .nav-link {
      background: none; border: none; padding: 6px 2px; font-family: var(--sans);
      font-size: 13.5px; font-weight: 500; color: var(--ink-2); cursor: pointer;
      position: relative; transition: color .15s; letter-spacing: .3px;
    }
    .nav-link:hover, .nav-link.active { color: var(--ink); font-weight: 600; }
    .nav-link.active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -2px;
      height: 2px; background: var(--gold);
    }
    .cart-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--ink); color: #fff; border: none;
      padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: .15s;
    }
    .cart-btn:hover { background: #2c2620; }
    .cart-badge {
      background: var(--gold); color: #fff; font-size: 11px; font-weight: 700;
      padding: 2px 7px; border-radius: 999px;
    }

    /* ---------------- Main Container ---------------- */
    .site-main {
      max-width: 1180px; margin: 0 auto; padding: 0 24px 72px; min-height: 72vh;
    }

    /* ---------------- Home Page ---------------- */
    .hero-section {
      display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: center;
      padding: 56px 0 64px; border-bottom: 1px solid var(--line);
    }
    @media (max-width: 820px) {
      .hero-section { grid-template-columns: 1fr; padding: 32px 0 44px; gap: 32px; text-align: center; }
      .hero-actions { justify-content: center; }
      .hero-stats { justify-content: center; }
    }
    .hero-eyebrow {
      display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--gold-dark); margin-bottom: 14px;
    }
    .hero-title {
      font-family: var(--serif); font-size: clamp(34px, 4.5vw, 54px);
      font-weight: 600; line-height: 1.12; margin: 0 0 18px; color: var(--ink);
    }
    .hero-title em { font-style: italic; font-weight: 400; color: var(--gold-dark); }
    .hero-desc {
      font-size: 15.5px; line-height: 1.7; color: var(--ink-2);
      margin: 0 0 28px; max-width: 520px;
    }
    @media (max-width: 820px) { .hero-desc { margin-left: auto; margin-right: auto; } }
    .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .btn-gold {
      background: var(--ink); color: #fff; border: 1px solid var(--ink);
      padding: 15px 28px; border-radius: 10px; font-size: 14px; font-weight: 600;
      letter-spacing: .5px; cursor: pointer; transition: .18s;
    }
    .btn-gold:hover { background: var(--gold-dark); border-color: var(--gold-dark); }
    .btn-outline {
      background: transparent; color: var(--ink); border: 1px solid var(--line);
      padding: 15px 24px; border-radius: 10px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: .18s;
    }
    .btn-outline:hover { border-color: var(--ink); background: #fff; }

    .hero-stats {
      display: flex; gap: 32px; margin-top: 36px; padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    .stat-num { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--ink); }
    .stat-label { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    .hero-visual {
      position: relative; display: flex; justify-content: center;
    }
    .hero-card {
      position: relative; width: 100%; max-width: 420px; border-radius: 20px;
      overflow: hidden; background: #14110e; box-shadow: 0 28px 60px rgba(20,17,14,.18);
      border: 1px solid rgba(180,142,85,.35);
    }
    .hero-card img {
      width: 100%; height: 440px; object-fit: cover; display: block;
    }
    .hero-card-badge {
      position: absolute; bottom: 18px; left: 18px; right: 18px;
      background: rgba(20, 17, 14, 0.86); backdrop-filter: blur(10px);
      padding: 14px 18px; border-radius: 12px; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid rgba(255,255,255,.12);
    }
    .hcb-title { font-family: var(--serif); font-size: 16px; font-weight: 600; }
    .hcb-sub { font-size: 11.5px; color: var(--gold-soft); margin-top: 2px; }
    .hcb-price { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--gold-soft); }

    /* Features Strip */
    .features-strip {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px; padding: 40px 0; border-bottom: 1px solid var(--line);
    }
    .feature-box {
      background: var(--surface); border: 1px solid var(--line-2);
      padding: 22px 24px; border-radius: 14px;
    }
    .feature-icon { font-size: 18px; color: var(--gold-dark); margin-bottom: 8px; }
    .feature-title { font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 0 0 6px; }
    .feature-text { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin: 0; }

    /* ---------------- Shop Page & Product Grid ---------------- */
    .section-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; padding: 44px 0 28px;
    }
    .section-eyebrow {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold-dark); font-weight: 600; margin-bottom: 6px;
    }
    .section-title { font-family: var(--serif); font-size: 32px; font-weight: 600; margin: 0; }
    .section-sub { font-size: 14px; color: var(--ink-2); margin: 6px 0 0; }

    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 28px;
    }
    .product-card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
      transition: transform .2s, box-shadow .2s;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(20,17,14,.08);
    }
    .pc-img-wrap {
      position: relative; height: 340px; background: #14110e; overflow: hidden; cursor: pointer;
    }
    .pc-img-wrap img {
      width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease;
    }
    .product-card:hover .pc-img-wrap img { transform: scale(1.04); }
    .pc-tag {
      position: absolute; top: 14px; left: 14px;
      background: rgba(20,17,14,.82); backdrop-filter: blur(6px);
      color: var(--gold-soft); font-size: 10.5px; font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase;
      padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(180,142,85,.4);
    }
    .pc-body { padding: 22px; display: flex; flex-direction: column; flex: 1; }
    .pc-inspiration { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-dark); font-weight: 600; }
    .pc-title {
      font-family: var(--serif); font-size: 22px; font-weight: 600;
      margin: 4px 0 6px; cursor: pointer; color: var(--ink);
    }
    .pc-notes { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin: 0 0 18px; flex: 1; }
    .pc-price-row {
      display: flex; align-items: baseline; justify-content: space-between;
      padding-top: 14px; border-top: 1px solid var(--line-2); margin-bottom: 16px;
    }
    .pc-price { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--ink); }
    .pc-shipping-note { font-size: 11.5px; color: var(--ink-3); }
    .pc-actions { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }
    .btn-card-sec {
      padding: 12px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-card-sec:hover { border-color: var(--ink); }
    .btn-card-pri {
      padding: 12px; border-radius: 10px; border: none;
      background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-card-pri:hover { background: var(--gold-dark); }

    /* ---------------- Product Detail View ---------------- */
    .detail-wrap {
      padding: 36px 0;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; color: var(--ink-2); font-size: 13.5px;
      font-weight: 500; cursor: pointer; padding: 0; margin-bottom: 24px;
    }
    .back-link:hover { color: var(--ink); }
    .detail-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start;
      background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 36px;
    }
    @media (max-width: 820px) { .detail-grid { grid-template-columns: 1fr; padding: 22px; gap: 28px; } }
    .detail-img {
      width: 100%; height: 440px; object-fit: cover; border-radius: 14px; background: #14110e;
    }
    .p-meta { list-style: none; padding: 0; margin: 20px 0 28px; display: flex; flex-direction: column; gap: 10px; }
    .p-meta li { font-size: 13.5px; color: var(--ink-2); padding-left: 20px; position: relative; }
    .p-meta li::before { content: '✦'; position: absolute; left: 0; color: var(--gold-dark); font-size: 12px; top: 1px; }

    /* ---------------- Checkout Container (Cart / Delivery / Payment / Done) ---------------- */
    .checkout-container {
      max-width: 660px; margin: 36px auto 0;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 18px; padding: 32px; box-shadow: 0 16px 40px rgba(20,17,14,.05);
    }
    .stepper {
      display: flex; align-items: center; justify-content: center;
      padding-bottom: 24px; margin-bottom: 28px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; gap: 6px;
    }
    .step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
    .step.active { color: var(--ink); font-weight: 600; }
    .step .num {
      width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ink-3);
      display: flex; align-items: center; justify-content: center; font-size: 11px;
    }
    .step.active .num { background: var(--ink); color: #fff; border-color: var(--ink); }
    .step.done .num { background: var(--gold); border-color: var(--gold); color: #fff; }
    .step-line { width: 32px; height: 1.5px; background: var(--line); margin: 0 6px; }

    .section-h { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0 0 20px; }
    .cart-item {
      display: flex; align-items: center; gap: 16px; padding: 16px;
      border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; background: var(--app-bg);
    }
    .ci-thumb-photo { width: 64px; height: 76px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; background: #14110e; }
    .ci-info { flex: 1; }
    .ci-name { font-size: 15px; font-weight: 600; }
    .ci-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
    .ci-price { font-family: var(--serif); font-size: 18px; font-weight: 700; }

    .addon {
      display: flex; align-items: center; gap: 12px; padding: 15px;
      border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px;
      cursor: pointer; background: #fff; transition: .12s;
    }
    .addon:hover { border-color: var(--gold); }
    .checkbox {
      width: 22px; height: 22px; border: 1.5px solid var(--ink-3); border-radius: 6px;
      flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    }
    .checkbox.checked { background: var(--ink); border-color: var(--ink); }
    .checkbox.checked::after {
      content: ''; width: 6px; height: 11px; border: solid #fff;
      border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px);
    }
    .addon-text { font-size: 14px; font-weight: 500; flex: 1; }
    .addon-price { color: var(--ink-2); font-weight: 600; }

    .line {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; padding: 12px 0; border-bottom: 1px solid var(--line-2);
    }
    .line span:last-child { font-weight: 600; }
    .total-line {
      border-bottom: none; border-top: 1.5px solid var(--ink);
      margin-top: 6px; padding-top: 16px; font-size: 17px; font-weight: 700;
    }
    .total-line span:last-child { font-family: var(--serif); font-size: 22px; }

    .field { display: block; margin-bottom: 16px; }
    .field span { display: block; font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; font-weight: 600; }
    .field input {
      width: 100%; padding: 13px 14px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 14px; font-family: var(--sans); color: var(--ink); background: #fff;
    }
    .field input:focus { outline: none; border-color: var(--gold); }
    .method, .pay-method {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--app-bg); margin: 12px 0 20px;
    }
    .pm-radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); position: relative; }
    .pm-radio.checked::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--ink); }
    .pm-info { flex: 1; }
    .pm-name, .method-name { font-size: 14.5px; font-weight: 600; }
    .pm-sub, .method-sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    .pm-badge { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--gold-dark); border: 1px solid var(--gold); padding: 3px 8px; border-radius: 5px; }

    .btn-primary {
      width: 100%; padding: 16px; border-radius: 12px; border: none;
      background: var(--ink); color: #fff; font-family: var(--sans);
      font-size: 15px; font-weight: 600; letter-spacing: .3px; cursor: pointer;
      transition: .15s; margin-top: 18px;
    }
    .btn-primary:hover { background: var(--gold-dark); }

    .confirm { text-align: center; padding: 16px 0; }
    .check-circle {
      width: 64px; height: 64px; border-radius: 50%; background: var(--success); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 18px;
    }
    .confirm-title { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 0 0 8px; }
    .confirm-paid { font-size: 15px; color: var(--ink-2); margin-bottom: 18px; }
    .confirm-paid b { font-family: var(--serif); font-size: 22px; color: var(--ink); }
    .budget-warn {
      display: inline-block; background: var(--danger-bg); color: var(--danger);
      border: 1px solid #ffc9c9; font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: 9px; margin-bottom: 18px;
    }
    .receipt { text-align: left; background: var(--app-bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 18px; margin-bottom: 16px; }
    .confirm-meta { font-size: 12px; color: var(--ink-3); }

    /* ---------------- Footer ---------------- */
    .site-footer {
      background: #14110e; color: #b8b2a8; padding: 44px 24px 32px; margin-top: 60px;
    }
    .footer-inner {
      max-width: 1180px; margin: 0 auto; display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid rgba(255,255,255,.1); padding-bottom: 24px;
    }
    .footer-copy { max-width: 1180px; margin: 20px auto 0; font-size: 12px; color: #78726a; display: flex; justify-content: space-between; flex-wrap: wrap; }

    /* ---------------- Telemetry View ---------------- */
    .telemetry-wrap { background: var(--ws-bg); min-height: calc(100vh - 55px); padding: 36px 24px 70px; color: #f1ede6; }
    .telemetry { max-width: 1180px; margin: 0 auto; }
    .tele-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 22px; }
    .tele-head h2 { font-family: var(--serif); font-size: 26px; font-weight: 600; margin: 0 0 4px; }
    .tele-sub { font-size: 13px; color: #9aa0aa; margin: 0; max-width: 600px; line-height: 1.5; }
    .tele-actions { display: flex; gap: 10px; }

    .card-v { font-family: var(--serif); font-size: 30px; font-weight: 600; color: #f4f0e9; }

    .tele-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tele-table th { text-align: left; padding: 13px 16px; background: rgba(0,0,0,.35); color: #b9bec7; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,.08); }
    .tele-table td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.05); color: #dfe3e9; }
    .grp { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 6px; background: rgba(180,142,85,.25); color: #e9cfa6; }
    .empty { text-align: center; color: #8b9099; padding: 40px; font-style: italic; }

    .blind-exit {
      background: rgba(20,17,14,.75); color: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.15);
      font-size: 11px; padding: 6px 12px; border-radius: 20px; cursor: pointer; backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
  (function(){
    "use strict";

    /* ============================ CATALOG & CONFIG ============================ */
    var PRODUCTS = [
      {
        id: 'hero',
        name: 'SOOVEŔ Bleu Noir',
        subtitle: 'Inspired by Bleu de Chanel · 30 ml',
        tag: 'Signature Best Seller',
        price: 50,
        img: 'hero.jpg',
        remoteImg: 'https:' + '//www.designarena.ai/u/042f2a76-1d0e-4ff9-bc2f-eb5ae7dc8c0d',
        notes: 'Crisp citrus, warm amber, and smoky incense wood crafted for timeless everyday elegance.',
        highlights: ['Long-lasting · 8hr wear', 'Cruelty-free · Vegan formula', 'Hand-blended in Dhaka']
      },
      {
        id: 'alt1',
        name: 'SOOVEŔ Crimson Desire',
        subtitle: 'Inspired by Dunhill Desire · 30 ml',
        tag: 'Evening Edition',
        price: 75,
        img: 'alt1.jpg',
        remoteImg: 'https:' + '//www.designarena.ai/u/eb2cc76b-4481-4981-83c2-329655ce78c9',
        notes: 'A bold fragrance of striking contrasts—bergamot, roasted coffee, creamy almond, and patchouli.',
        highlights: ['Rich magnetic projection', 'Warm spice & tonka bean base', 'Pocket-friendly luxury flacon']
      },
      {
        id: 'alt2',
        name: 'SOOVEŔ Velvet Royale',
        subtitle: 'Inspired by Good Girl · 30 ml',
        tag: ' Collector’s Reserve',
        price: 100,
        img: 'alt2.jpg',
        remoteImg: 'https:' + '//www.designarena.ai/u/a2926828-7ef3-41c9-aab5-d8fc0fad893c',
        notes: 'Luminous jasmine and tuberose layered over dark roasted cocoa, velvet musk, and sweet amber.',
        highlights: ['Supreme Extrait concentration', 'Signature chess-edition bottle', 'Crafted in Dhaka']
      }
    ];

    var CONFIG = {
      deliveryFee: 50,
      giftBoxFee: 80,
      platformFee: 25,
      budget: 200,
      urgencyStart: 170,
      customer: {
        name: 'Tanvir Ahmed',
        address: 'House 14, Road 7, Dhanmondi, Dhaka',
        phone: '01711-000000'
      }
    };

    /* ============================ STATE & GOOGLE SHEETS ============================ */
    var STORAGE_KEY = 'soover_p1_telemetry_v2';
    var SHEET_URL = 'https:' + '//script.google.com/macros/s/AKfycbw7sMkpo8oV8aIkt_Hk-g-eAgkEuwDJE57Y-i0ZHFOP10raZha6jr3t52RCQ7Q2X_63jQ/exec';
    var telemetry = [];
    try { telemetry = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}

    var sessions = {};
    var view = 'A'; // 'A' or 'telemetry'
    var blind = false;
    var inspectorOn = true;

    /* ============================ HELPERS ============================ */
    function fmt(n){ return '৳' + n; }
    function esc(str){
      return String(str).replace(/[&<>"]/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
      });
    }
    function uid(){ return 's' + Math.random().toString(36).slice(2,8); }
    function getProduct(id){
      for(var i=0; i<PRODUCTS.length; i++){
        if(PRODUCTS[i].id === id) return PRODUCTS[i];
      }
      return PRODUCTS[0];
    }

    function log(s, screen, action, detail){
      var elapsedSec = s.startedAt ? Math.round((Date.now() - s.startedAt) / 1000) : 0;
      var entry = {
        t: new Date().toISOString(),
        sessionId: s.id,
        group: s.prototype,
        screen: screen,
        action: action,
        detail: detail,
        elapsedSec: elapsedSec,
        misclicks: s.misclicks || 0
      };
      telemetry.push(entry);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(telemetry)); } catch(e) {}
      if (SHEET_URL && typeof fetch === 'function') {
        fetch(SHEET_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(entry)
        }).catch(function(){});
      }
    }

    /*
      Screen numbers:
      0 = Home Page
      1 = Shop Page (3 Perfumes: ৳50, ৳75, ৳100)
      6 = Product Detail Page
      2 = Cart Screen
      3 = Delivery Screen
      4 = Payment & Review Screen
      5 = Order Confirmation Screen
    */
    function createSession(prototype){
      return {
        id: uid(),
        prototype: prototype,
        screen: 0, // Starts on Home Page
        selectedProductId: 'hero',
        giftBox: false,
        customer: { name: CONFIG.customer.name, address: CONFIG.customer.address, phone: CONFIG.customer.phone },
        startedAt: Date.now(),
        misclicks: 0
      };
    }

    function ensureSession(p){
      if(!sessions[p]){
        sessions[p] = createSession(p);
        log(sessions[p], 'Home', 'session_start', 'Prototype ' + p + ' session started on Home page');
      }
      return sessions[p];
    }

    function go(s, screen, label){
      if(s.screen !== screen){
        s.screen = screen;
        log(s, label || String(screen), 'screen_view', 'Viewed ' + (label || 'screen ' + screen));
      }
      render();
      if(typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
    }

    function startNewSession(s){
      s.id = uid();
      s.screen = 0;
      s.selectedProductId = 'hero';
      s.giftBox = false;
      s.customer = { name: CONFIG.customer.name, address: CONFIG.customer.address, phone: CONFIG.customer.phone };
      s.startedAt = Date.now();
      s.misclicks = 0;
      log(s, 'Home', 'session_start', 'New session started');
      render();
    }

    function totals(s){
      var prod = getProduct(s.selectedProductId);
      var item = prod.price;
      var gift = s.giftBox ? CONFIG.giftBoxFee : 0;
      var delivery = CONFIG.deliveryFee;
      return { prod: prod, item: item, gift: gift, delivery: delivery, total: item + gift + delivery };
    }

    /* ============================ PAGES ============================ */
    function homeHTML(s){
      var heroProd = PRODUCTS[0];
      var previewCards = PRODUCTS.map(function(p){
        return '<div class="product-card">'
          + '<div class="pc-img-wrap" data-action="viewProduct" data-product="' + p.id + '">'
          + '<span class="pc-tag">' + esc(p.tag) + '</span>'
          + '<img src="' + p.img + '" onerror="this.onerror=null;this.src=\'' + p.remoteImg + '\';" alt="' + esc(p.name) + '" />'
          + '</div>'
          + '<div class="pc-body">'
          + '<div class="pc-inspiration">' + esc(p.subtitle) + '</div>'
          + '<h3 class="pc-title" data-action="viewProduct" data-product="' + p.id + '">' + esc(p.name) + '</h3>'
          + '<p class="pc-notes">' + esc(p.notes) + '</p>'
          + '<div class="pc-price-row">'
          + '<span class="pc-price">' + fmt(p.price) + '</span>'
          + '<span class="pc-shipping-note">+' + fmt(CONFIG.deliveryFee) + ' Inside Dhaka</span>'
          + '</div>'
          + '<div class="pc-actions">'
          + '<button class="btn-card-sec" data-action="viewProduct" data-product="' + p.id + '">Details</button>'
          + '<button class="btn-card-pri" data-action="buyProduct" data-product="' + p.id + '">Add to Cart · ' + fmt(p.price) + '</button>'
          + '</div>'
          + '</div></div>';
      }).join('');

      return ''
        + '<section class="hero-section">'
        + '<div>'
        + '<span class="hero-eyebrow">SOOVEŔ · Maison de Parfum · Dhaka</span>'
        + '<h1 class="hero-title">Expressing <em>Royalty</em> in Every Drop.</h1>'
        + '<p class="hero-desc">Discover handcrafted luxury extrait fragrances designed to leave an unforgettable signature. Transparent pricing, pure vegan oils, and instant delivery across Dhaka.</p>'
        + '<div class="hero-actions">'
        + '<button class="btn-gold" data-action="goShop">Explore Shop Collection →</button>'
        + '<button class="btn-outline" data-action="buyProduct" data-product="hero">Quick Buy Bleu Noir (' + fmt(heroProd.price) + ')</button>'
        + '</div>'
        + '<div class="hero-stats">'
        + '<div><div class="stat-num">৳50 – ৳100</div><div class="stat-label">Accessible Luxury</div></div>'
        + '<div><div class="stat-num">8+ Hours</div><div class="stat-label">Lasting Projection</div></div>'
        + '<div><div class="stat-num">24h</div><div class="stat-label">Dhaka Dispatch</div></div>'
        + '</div>'
        + '</div>'
        + '<div class="hero-visual">'
        + '<div class="hero-card" data-action="viewProduct" data-product="hero" style="cursor:pointer;">'
        + '<img src="' + heroProd.img + '" onerror="this.onerror=null;this.src=\'' + heroProd.remoteImg + '\';" alt="SOOVEŔ Bleu Noir" />'
        + '<div class="hero-card-badge">'
        + '<div><div class="hcb-title">' + esc(heroProd.name) + '</div><div class="hcb-sub">Signature Edition · In Stock</div></div>'
        + '<div class="hcb-price">' + fmt(heroProd.price) + '</div>'
        + '</div>'
        + '</div>'
        + '</div>'
        + '</section>'
        + '<section class="features-strip">'
        + '<div class="feature-box"><div class="feature-icon">✦</div><h3 class="feature-title">Transparent Pricing</h3><p class="feature-text">Zero hidden handling fees. Flat ' + fmt(CONFIG.deliveryFee) + ' standard delivery inside Dhaka shown upfront.</p></div>'
        + '<div class="feature-box"><div class="feature-icon">✦</div><h3 class="feature-title">Extrait de Parfum</h3><p class="feature-text">High-concentration fragrance oils formulated for warm climate longevity and rich projection.</p></div>'
        + '<div class="feature-box"><div class="feature-icon">✦</div><h3 class="feature-title">Instant Mobile Checkout</h3><p class="feature-text">Seamless payment via bKash and Nagad with real-time order confirmation.</p></div>'
        + '</section>'
        + '<section>'
        + '<div class="section-head">'
        + '<div><div class="section-eyebrow">Curated Lineup</div><h2 class="section-title">Featured Fragrances</h2></div>'
        + '<button class="btn-outline" data-action="goShop">View Full Shop →</button>'
        + '</div>'
        + '<div class="product-grid">' + previewCards + '</div>'
        + '</section>';
    }

    function shopHTML(s){
      var cards = PRODUCTS.map(function(p){
        return '<div class="product-card">'
          + '<div class="pc-img-wrap" data-action="viewProduct" data-product="' + p.id + '">'
          + '<span class="pc-tag">' + esc(p.tag) + '</span>'
          + '<img src="' + p.img + '" onerror="this.onerror=null;this.src=\'' + p.remoteImg + '\';" alt="' + esc(p.name) + '" />'
          + '</div>'
          + '<div class="pc-body">'
          + '<div class="pc-inspiration">' + esc(p.subtitle) + '</div>'
          + '<h3 class="pc-title" data-action="viewProduct" data-product="' + p.id + '">' + esc(p.name) + '</h3>'
          + '<p class="pc-notes">' + esc(p.notes) + '</p>'
          + '<div class="pc-price-row">'
          + '<span class="pc-price">' + fmt(p.price) + '</span>'
          + '<span class="pc-shipping-note">+' + fmt(CONFIG.deliveryFee) + ' Inside Dhaka delivery</span>'
          + '</div>'
          + '<div class="pc-actions">'
          + '<button class="btn-card-sec" data-action="viewProduct" data-product="' + p.id + '">View Details</button>'
          + '<button class="btn-card-pri" data-action="buyProduct" data-product="' + p.id + '">Add to Cart</button>'
          + '</div>'
          + '</div></div>';
      }).join('');

      return '<section>'
        + '<div class="section-head">'
        + '<div>'
        + '<div class="section-eyebrow">Official Boutique Catalog</div>'
        + '<h1 class="section-title">The Fragrance Shop</h1>'
        + '<p class="section-sub">Select any fragrance below. All prices are shown transparently in BDT (৳) with flat ' + fmt(CONFIG.deliveryFee) + ' Inside Dhaka delivery.</p>'
        + '</div>'
        + '</div>'
        + '<div class="product-grid">' + cards + '</div>'
        + '</section>';
    }

    function productDetailHTML(s){
      var p = getProduct(s.selectedProductId);
      var bullets = p.highlights.map(function(h){ return '<li>' + esc(h) + '</li>'; }).join('');
      return '<div class="detail-wrap">'
        + '<button class="back-link" data-action="goShop">← Back to Shop Collection</button>'
        + '<div class="detail-grid">'
        + '<div><img class="detail-img" src="' + p.img + '" onerror="this.onerror=null;this.src=\'' + p.remoteImg + '\';" alt="' + esc(p.name) + '" /></div>'
        + '<div>'
        + '<div class="section-eyebrow">' + esc(p.tag) + '</div>'
        + '<h1 class="section-title" style="margin-bottom:6px;">' + esc(p.name) + '</h1>'
        + '<div style="font-size:13.5px;color:var(--ink-2);margin-bottom:18px;">' + esc(p.subtitle) + '</div>'
        + '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px;">'
        + '<span style="font-family:var(--serif);font-size:34px;font-weight:700;">' + fmt(p.price) + '</span>'
        + '<span style="font-size:13px;color:var(--ink-2);">(+' + fmt(CONFIG.deliveryFee) + ' Inside Dhaka delivery)</span>'
        + '</div>'
        + '<div style="font-size:12.5px;color:var(--success);font-weight:600;margin-bottom:20px;">● In Stock — Ships in 24h</div>'
        + '<p style="font-size:14.5px;line-height:1.7;color:var(--ink-2);">' + esc(p.notes) + '</p>'
        + '<ul class="p-meta">' + bullets + '</ul>'
        + '<button class="btn-primary" data-action="addToCart">Add to Cart — ' + fmt(p.price) + '</button>'
        + '</div>'
        + '</div></div>';
    }

    function stepperHTML(s){
      var steps = [{n:2,l:'1',t:'Cart'},{n:3,l:'2',t:'Delivery'},{n:4,l:'3',t:'Payment'},{n:5,l:'4',t:'Done'}];
      return '<div class="stepper">' + steps.map(function(st, idx){
        var cls = st.n === s.screen ? 'step active' : (st.n < s.screen ? 'step done' : 'step');
        var line = idx < steps.length - 1 ? '<span class="step-line"></span>' : '';
        return '<div class="' + cls + '"><span class="num">' + st.l + '</span>' + st.t + '</div>' + line;
      }).join('') + '</div>';
    }

    function cartHTML(s){
      var t = totals(s);
      return '<div class="checkout-container">'
        + stepperHTML(s)
        + '<button class="back-link" data-action="goShop">← Continue Shopping</button>'
        + '<h2 class="section-h">Your Shopping Bag</h2>'
        + '<div class="cart-item">'
        + '<img class="ci-thumb-photo" src="' + t.prod.img + '" onerror="this.onerror=null;this.src=\'' + t.prod.remoteImg + '\';" alt="' + esc(t.prod.name) + '" />'
        + '<div class="ci-info"><div class="ci-name">' + esc(t.prod.name) + '</div><div class="ci-sub">' + esc(t.prod.subtitle) + ' · Qty 1</div></div>'
        + '<div class="ci-price">' + fmt(t.item) + '</div>'
        + '</div>'
        + '<div class="addon" data-action="toggleGiftBox">'
        + '<div class="checkbox ' + (s.giftBox ? 'checked' : '') + '"></div>'
        + '<div class="addon-text">Optional Gift Box &amp; Bubble Wrap <span class="addon-price">(+' + fmt(CONFIG.giftBoxFee) + ')</span></div>'
        + '</div>'
        + '<div class="line"><span>Item Price</span><span>' + fmt(t.item) + '</span></div>'
        + (s.giftBox ? '<div class="line"><span>Gift Box &amp; Bubble Wrap</span><span>' + fmt(t.gift) + '</span></div>' : '')
        + '<div class="line"><span>Inside Dhaka Standard Delivery</span><span>' + fmt(t.delivery) + '</span></div>'
        + '<div class="line total-line"><span>Total</span><span>' + fmt(t.total) + '</span></div>'
        + '<button class="btn-primary" data-action="proceedCheckout">Proceed to Checkout (' + fmt(t.total) + ')</button>'
        + '</div>';
    }

    function deliveryHTML(s){
      var t = totals(s);
      return '<div class="checkout-container">'
        + stepperHTML(s)
        + '<button class="back-link" data-action="goCart">← Back to Cart</button>'
        + '<h2 class="section-h">Delivery Information</h2>'
        + '<label class="field"><span>Full Name</span><input data-field="name" value="' + esc(s.customer.name) + '" /></label>'
        + '<label class="field"><span>Delivery Address</span><input data-field="address" value="' + esc(s.customer.address) + '" /></label>'
        + '<label class="field"><span>Phone Number</span><input data-field="phone" value="' + esc(s.customer.phone) + '" /></label>'
        + '<div class="method"><div class="pm-info"><div class="method-name">Inside Dhaka Standard Delivery</div><div class="method-sub">Estimated 1–2 business days</div></div>'
        + '<div class="ci-price">' + fmt(CONFIG.deliveryFee) + '</div></div>'
        + '<button class="btn-primary" data-action="continuePayment">Continue to Payment (' + fmt(t.total) + ')</button>'
        + '</div>';
    }

    function paymentHTML(s){
      var t = totals(s);
      return '<div class="checkout-container">'
        + stepperHTML(s)
        + '<button class="back-link" data-action="goCart">← Edit Cart</button>'
        + '<h2 class="section-h">Payment &amp; Order Review</h2>'
        + '<div class="pay-method"><div class="pm-radio checked"></div>'
        + '<div class="pm-info"><div class="pm-name">bKash / Nagad</div><div class="pm-sub">Instant Mobile Wallet Verification</div></div>'
        + '<div class="pm-badge">SELECTED</div></div>'
        + '<div class="receipt">'
        + '<div class="line"><span>' + esc(t.prod.name) + '</span><span>' + fmt(t.item) + '</span></div>'
        + (s.giftBox ? '<div class="line"><span>Gift Box &amp; Bubble Wrap</span><span>' + fmt(t.gift) + '</span></div>' : '')
        + '<div class="line"><span>Inside Dhaka Delivery</span><span>' + fmt(t.delivery) + '</span></div>'
        + '<div class="line total-line"><span>Final Total</span><span>' + fmt(t.total) + '</span></div>'
        + '</div>'
        + '<button class="btn-primary" data-action="completeOrder">Complete Order (' + fmt(t.total) + ')</button>'
        + '</div>';
    }

    function confirmationHTML(s){
      var t = totals(s);
      var exceeded = t.total > CONFIG.budget;
      var warn = (inspectorOn && exceeded) ? '<div class="budget-warn">⚠ Budget Exceeded — ' + fmt(CONFIG.budget) + ' limit</div>' : '';
      return '<div class="checkout-container">'
        + stepperHTML(s)
        + '<div class="confirm">'
        + '<div class="check-circle">✓</div>'
        + '<h2 class="confirm-title">Order Confirmed!</h2>'
        + '<div class="confirm-paid">Total Paid: <b>' + fmt(t.total) + '</b></div>'
        + warn
        + '<div class="receipt">'
        + '<div class="line"><span>' + esc(t.prod.name) + '</span><span>' + fmt(t.item) + '</span></div>'
        + (s.giftBox ? '<div class="line"><span>Gift Box &amp; Bubble Wrap</span><span>' + fmt(t.gift) + '</span></div>' : '')
        + '<div class="line"><span>Inside Dhaka Delivery</span><span>' + fmt(t.delivery) + '</span></div>'
        + '<div class="line total-line"><span>Amount Charged</span><span>' + fmt(t.total) + '</span></div>'
        + '</div>'
        + '<div class="confirm-meta">Order #SOOVER-' + s.id.toUpperCase().slice(0,6) + ' · ' + esc(s.customer.name) + '</div>'
        + '<button class="btn-primary" data-action="startNewSession">Start New Session</button>'
        + '</div></div>';
    }

    function activeScreenHTML(s){
      switch(s.screen){
        case 0: return homeHTML(s);
        case 1: return shopHTML(s);
        case 6: return productDetailHTML(s);
        case 2: return cartHTML(s);
        case 3: return deliveryHTML(s);
        case 4: return paymentHTML(s);
        case 5: return confirmationHTML(s);
        default: return homeHTML(s);
      }
    }

    /* ============================ SHELL ============================ */
    function websiteShell(s){
      var t = totals(s);
      return '<div class="storefront" data-session="' + s.prototype + '">'
        + '<div class="announce-bar"><b>SOOVEŔ MAISON DE PARFUM</b> · Handcrafted Fragrances from ৳50 · Standard Inside Dhaka Delivery ৳50</div>'
        + '<header class="site-header">'
        + '<div class="header-inner">'
        + '<a class="site-brand" data-action="goHome">'
        + '<div class="site-logo">SO</div>'
        + '<div class="site-name-wrap"><span class="site-name">SOOVEŔ</span><span class="site-tagline">Expressing Royalty</span></div>'
        + '</a>'
        + '<nav class="site-nav">'
        + '<button class="nav-link ' + (s.screen===0?'active':'') + '" data-action="goHome">Home</button>'
        + '<button class="nav-link ' + (s.screen===1 || s.screen===6?'active':'') + '" data-action="goShop">Shop (3)</button>'
        + '<button class="cart-btn" data-action="goCart"><span>🛒 Bag</span><span class="cart-badge">' + fmt(t.item) + '</span></button>'
        + '</nav>'
        + '</div>'
        + '</header>'
        + '<main class="site-main">' + activeScreenHTML(s) + '</main>'
        + '<footer class="site-footer">'
        + '<div class="footer-inner">'
        + '<div><div class="site-name" style="color:#fff;font-size:18px;">SOOVEŔ</div><div style="font-size:12px;margin-top:4px;">Luxury Pocket &amp; Extrait Perfumes · Crafted in Dhaka, Bangladesh</div></div>'
        + '<div style="font-size:12.5px;">Secure Checkout via <b>bKash</b> &amp; <b>Nagad</b></div>'
        + '</div>'
        + '<div class="footer-copy"><span>© 2026 SOOVEŔ Bangladesh. All rights reserved.</span><span>Transparent Pricing · Inside Dhaka Delivery ৳50</span></div>'
        + '</footer>'
        + '</div>';
    }

    function taskBanner(){
      return '<div class="task-banner"><span class="task-tag">Participant Task</span>'
        + '<span>You have a strict budget of <b>' + fmt(CONFIG.budget) + '</b>. Explore the Shop, choose a SOOVEŔ perfume (৳50, ৳75, or ৳100), and complete checkout within your ' + fmt(CONFIG.budget) + ' budget.</span></div>';
    }

    function researcherLayout(){
      var s = ensureSession('A');
      return ''
        + '<header class="toolbar">'
        + '<div class="brand"><div class="brand-mark">SO</div>'
        + '<div><div class="brand-name">SOOVEŔ</div><div class="brand-sub">HCI Control Storefront</div></div></div>'
        + '<span class="sync-pill">● Google Sheets Live Sync</span>'
        + '<nav class="tabs">'
        + '<button class="tab ' + (view==='A'?'active':'') + '" data-view="A">Prototype 1 (Live Store)</button>'
        + '<button class="tab ' + (view==='telemetry'?'active':'') + '" data-view="telemetry">Researcher Telemetry Log (' + telemetry.length + ')</button>'
        + '</nav>'
        + '<div class="inspector"><span class="inspector-label">Participant Mode</span>'
        + '<button class="switch ' + (inspectorOn?'on':'') + '" data-action="toggleInspector"><span class="knob"></span></button>'
        + '<span class="inspector-state">' + (inspectorOn?'OFF':'ON') + '</span></div>'
        + '</header>'
        + (inspectorOn && view !== 'telemetry' ? taskBanner() : '')
        + (view === 'telemetry' ? telemetryHTML() : websiteShell(s));
    }

    function blindLayout(){
      var s = ensureSession('A');
      return '<div class="blind-exit-wrap"><button class="blind-exit" data-action="exitBlind">Researcher Panel ↗</button></div>'
        + websiteShell(s);
    }

    /* ============================ TELEMETRY LOG ============================ */
    function telemetryHTML(){
      var comps = telemetry.filter(function(e){ return e.action === 'complete_order'; });
      var exceeded = comps.filter(function(e){ return e.detail.indexOf('EXCEEDED') > -1; }).length;
      var sessionsCount = telemetry.filter(function(e){ return e.action === 'session_start'; }).length;
      var aComp = comps.filter(function(e){ return e.group === 'A'; });
      function avg(arr){
        if(!arr.length) return '—';
        var sum = arr.reduce(function(a,e){
          var m = e.detail.match(/Final\s*=\s*৳(\d+)/); return a + (m ? parseInt(m[1],10) : 0);
        },0);
        return fmt(Math.round(sum/arr.length));
      }
      var rows = telemetry.slice().reverse().map(function(e){
        return '<tr><td class="mono">' + e.t + '</td>'
          + '<td class="mono">' + esc(e.sessionId || '—') + '</td>'
          + '<td><span class="grp">' + e.group + '</span></td>'
          + '<td>' + esc(e.screen) + '</td>'
          + '<td class="mono">' + esc(e.action) + '</td>'
          + '<td>' + esc(e.detail) + '</td>'
          + '<td class="mono">' + (e.elapsedSec || 0) + 's</td>'
          + '<td class="mono">' + (e.misclicks || 0) + '</td></tr>';
      }).join('');
      return '<div class="telemetry-wrap"><div class="telemetry">'
        + '<div class="tele-head"><div><h2>Researcher Telemetry Log</h2>'
        + '<p class="tele-sub">Every participant action is automatically sent to your Google Sheet (SOOVER HCI Data) and backed up in localStorage.</p></div>'
        + '<div class="tele-actions"><button class="btn-ghost" data-action="exportCsv">⬇ Export CSV</button>'
        + '<button class="btn-ghost danger" data-action="clearLog">Clear Log</button></div></div>'
        + '<div class="cards">'
        + '<div class="card"><div class="card-v">' + sessionsCount + '</div><div class="card-l">Sessions</div></div>'
        + '<div class="card"><div class="card-v">' + comps.length + '</div><div class="card-l">Completed Orders</div></div>'
        + '<div class="card ' + (exceeded?'card-warn':'') + '"><div class="card-v">' + exceeded + '</div><div class="card-l">Budget Exceeded (&gt;' + fmt(CONFIG.budget) + ')</div></div>'
        + '<div class="card"><div class="card-v">' + avg(aComp) + '</div><div class="card-l">Avg Order Total</div></div>'
        + '</div>'
        + '<div class="table-wrap"><table class="tele-table"><thead><tr>'
        + '<th>Timestamp</th><th>Session</th><th>Group</th><th>Screen</th><th>Event</th><th>Detail</th><th>Time</th><th>Misclicks</th></tr></thead><tbody>'
        + (rows || '<tr><td colspan="8" class="empty">No events recorded yet. Explore the store to populate this log.</td></tr>')
        + '</tbody></table></div></div></div>';
    }

    function csvCell(v){
      v = String(v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
    }
    function exportCsv(){
      var header = ['Timestamp','Session_ID','Group','Screen','Event','Detail','Elapsed_Sec','Misclicks'];
      var lines = [header].concat(telemetry.map(function(e){
        return [e.t, e.sessionId || '', e.group, e.screen, e.action, e.detail, e.elapsedSec || 0, e.misclicks || 0];
      }));
      var csv = lines.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
      var blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'soover-prototype-1-telemetry.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    /* ============================ ACTIONS ============================ */
    function handleAction(action, el){
      var s = ensureSession('A');
      var prodId = el.dataset && el.dataset.product ? el.dataset.product : null;
      switch(action){
        case 'toggleInspector':
          blind = !blind; inspectorOn = !blind;
          if(blind) view = 'A';
          render(); break;
        case 'exitBlind':
          blind = false; inspectorOn = true; render(); break;
        case 'exportCsv': exportCsv(); break;
        case 'clearLog':
          telemetry.length = 0;
          try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
          render(); break;
        case 'goHome':
          go(s, 0, 'Home'); break;
        case 'goShop':
          log(s, 'Shop', 'open_shop', 'Opened Shop catalog (৳50, ৳75, ৳100)');
          go(s, 1, 'Shop'); break;
        case 'goCart':
          go(s, 2, 'Cart'); break;
        case 'viewProduct':
          if(prodId) s.selectedProductId = prodId;
          var vp = getProduct(s.selectedProductId);
          log(s, 'Product', 'view_product', 'Viewed ' + vp.name + ' (' + fmt(vp.price) + ')');
          go(s, 6, 'Product_Detail'); break;
        case 'buyProduct':
          if(prodId) s.selectedProductId = prodId;
          var bp = getProduct(s.selectedProductId);
          log(s, 'Shop', 'add_to_cart', 'Added ' + bp.name + ' (' + fmt(bp.price) + ') to cart');
          go(s, 2, 'Cart'); break;
        case 'addToCart':
          var ap = getProduct(s.selectedProductId);
          log(s, 'Product', 'add_to_cart', 'Added ' + ap.name + ' (' + fmt(ap.price) + ') to cart');
          go(s, 2, 'Cart'); break;
        case 'toggleGiftBox':
          s.giftBox = !s.giftBox;
          log(s, 'Cart', 'gift_box_toggle', 'Gift Box = ' + (s.giftBox?'ON (+৳80)':'OFF'));
          render(); break;
        case 'proceedCheckout':
          var tc = totals(s);
          log(s, 'Cart', 'proceed_checkout', 'Item = ' + tc.prod.name + ' (' + fmt(tc.item) + '); GiftBox = ' + (s.giftBox?'ON':'OFF') + '; Total = ' + fmt(tc.total));
          go(s, 3, 'Delivery'); break;
        case 'continuePayment':
          log(s, 'Delivery', 'continue_payment', 'Delivery confirmed for ' + s.customer.name);
          go(s, 4, 'Payment'); break;
        case 'completeOrder':
          var to = totals(s);
          log(s, 'Payment', 'complete_order', 'Item = ' + to.prod.name + ' (' + fmt(to.item) + '); Final = ' + fmt(to.total) + '; Budget = ' + (to.total>CONFIG.budget?'EXCEEDED':'WITHIN'));
          go(s, 5, 'Confirmation'); break;
        case 'startNewSession':
          startNewSession(s); break;
      }
    }

    function render(){
      var app = document.getElementById('app');
      app.innerHTML = blind ? blindLayout() : researcherLayout();
    }

    function init(){
      var params = new URLSearchParams(window.location.search);
      var blindParam = params.get('blind') === '1';
      view = 'A';
      blind = blindParam;
      inspectorOn = !blind;

      document.addEventListener('click', function(e){
        var a = e.target.closest('[data-action]');
        if(a){ handleAction(a.dataset.action, a); return; }
        var v = e.target.closest('[data-view]');
        if(v){ view = v.dataset.view; render(); return; }
        var w = e.target.closest('.site-main');
        if(w && !e.target.closest('button, input, label, a, [data-action]')){
          var s = sessions['A'];
          if(s && s.screen !== 5){
            s.misclicks = (s.misclicks || 0) + 1;
            var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : 'div';
            log(s, 'Screen_' + s.screen, 'misclick', 'Wrong click on ' + tag);
          }
        }
      });

      document.addEventListener('input', function(e){
        var f = e.target.closest('[data-field]');
        if(!f) return;
        var s = ensureSession('A');
        s.customer[f.dataset.field] = f.value;
      });

      render();
    }

    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', init);
    } else { init(); }
  })();
  </script>
</body>
</html>
