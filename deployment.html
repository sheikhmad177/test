<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOOVEŔ — HCI Dark Patterns Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23000'/><text x='16' y='21' font-family='Georgia,serif' font-size='13' fill='%23fff' text-anchor='middle'>SO</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --ws-1:#262b34; --ws-2:#161a20; --ws-3:#2f3540;
      --app-bg:#fbfaf8; --ink:#15110d; --ink-2:#6f6a63; --ink-3:#a39d94;
      --line:#e9e4dc; --line-2:#f1ede7;
      --accent:#15110d; --gold:#a9854f; --gold-soft:#c9b08a;
      --danger:#d62828; --danger-bg:#fdecec; --danger-line:#f3c0c0;
      --serif:'Playfair Display',Georgia,'Times New Roman',serif;
      --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      --radius:14px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:var(--sans);
      color:var(--ink);
      background:
        radial-gradient(1200px 600px at 50% -10%, #2c323d 0%, transparent 60%),
        linear-gradient(160deg,var(--ws-1),var(--ws-2));
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;}

    /* ---------------- Toolbar ---------------- */
    .toolbar{
      display:flex;align-items:center;gap:18px;flex-wrap:wrap;
      padding:14px 22px;background:rgba(18,21,26,.82);
      backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06);
      position:sticky;top:0;z-index:40;
    }
    .brand{display:flex;align-items:center;gap:12px;}
    .brand-mark{
      width:38px;height:38px;border-radius:9px;background:#000;color:#fff;
      display:flex;align-items:center;justify-content:center;
      font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.5px;
      border:1px solid var(--gold);
    }
    .brand-name{font-family:var(--serif);font-weight:600;letter-spacing:2px;font-size:15px;color:#f4f1ec;}
    .brand-sub{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#8b9099;}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
    .tab{
      border:1px solid rgba(255,255,255,.12);background:transparent;color:#c7ccd4;
      padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:500;cursor:pointer;
      transition:.15s;letter-spacing:.3px;
    }
    .tab:hover{border-color:rgba(255,255,255,.3);color:#fff;}
    .tab.active{background:#fff;color:#15110d;border-color:#fff;font-weight:600;}
    .inspector{display:flex;align-items:center;gap:9px;color:#c7ccd4;font-size:12.5px;}
    .inspector-label{letter-spacing:.5px;text-transform:uppercase;font-size:10.5px;color:#8b9099;}
    .switch{width:44px;height:24px;border-radius:12px;background:#3a3f47;position:relative;cursor:pointer;transition:.2s;border:none;padding:0;}
    .switch.on{background:var(--gold);}
    .switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;}
    .switch.on .knob{left:22px;}
    .inspector-state{font-weight:600;min-width:26px;color:#fff;}

    /* ---------------- Task banner ---------------- */
    .task-banner{
      display:flex;align-items:center;gap:14px;flex-wrap:wrap;
      margin:16px auto 0;max-width:1180px;padding:13px 18px;
      background:linear-gradient(90deg,rgba(169,133,79,.16),rgba(169,133,79,.05));
      border:1px solid rgba(169,133,79,.4);border-left:4px solid var(--gold);
      border-radius:10px;color:#f0ece4;
    }
    .task-tag{font-size:10.5px;font-weight:700;letter-spacing:1.5px;color:#e9cfa6;background:rgba(0,0,0,.35);padding:5px 9px;border-radius:6px;white-space:nowrap;}
    .task-text{font-size:13.5px;line-height:1.5;color:#eae6df;}

    /* ---------------- Stage ---------------- */
    .stage{
      display:flex;justify-content:center;align-items:flex-start;gap:40px;flex-wrap:wrap;
      padding:42px 20px 70px;min-height:calc(100vh - 120px);
    }
    .single-wrap,.side-col{display:flex;flex-direction:column;align-items:center;}
    .side-wrap{display:flex;gap:48px;flex-wrap:wrap;justify-content:center;}
    .side-label{
      font-family:var(--serif);font-size:16px;letter-spacing:.5px;color:#e9e4db;margin-bottom:16px;
      padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.12);width:100%;text-align:center;
    }
    .side-label.b{color:#f0b8b8;}
    .phone-caption{
      margin-top:16px;font-size:11.5px;color:#9aa0aa;letter-spacing:.4px;text-align:center;
      background:rgba(0,0,0,.25);padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.06);
    }
    .phone-caption b{color:var(--gold-soft);}

    /* ---------------- Website view ---------------- */
    .website{
      width:100%;max-width:1040px;margin:0 auto;background:var(--app-bg);
      min-height:780px;border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.5);
      display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.08);
    }
    .site-header{display:flex;align-items:center;justify-content:space-between;padding:18px 34px;border-bottom:1px solid var(--line-2);background:#fff;}
    .site-brand{display:flex;align-items:center;gap:13px;}
    .site-logo{width:42px;height:42px;border-radius:10px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:1px;border:1px solid var(--gold);}
    .site-name{font-family:var(--serif);font-size:23px;letter-spacing:4px;font-weight:600;}
    .site-nav{display:flex;align-items:center;gap:24px;font-size:13px;color:var(--ink-2);}
    .site-nav a{cursor:pointer;text-decoration:none;color:inherit;}
    .site-nav a:hover{color:var(--ink);}
    .site-cart{font-size:13px;color:var(--ink);font-weight:600;}
    .stepper{display:flex;align-items:center;justify-content:center;padding:16px 34px;background:#fff;border-bottom:1px solid var(--line-2);flex-wrap:wrap;}
    .step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);}
    .step.active{color:var(--ink);font-weight:600;}
    .step .num{width:25px;height:25px;border-radius:50%;border:1.5px solid var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3);}
    .step.active .num{background:var(--ink);color:#fff;border-color:var(--ink);}
    .step.done .num{background:var(--gold);border-color:var(--gold);color:#fff;}
    .step-line{width:46px;height:1.5px;background:var(--line);margin:0 12px;}
    .site-main{flex:1;padding:36px 34px 42px;overflow-y:auto;}
    .site-main .screen-pad{padding:0;}
    .site-footer{padding:18px 34px;border-top:1px solid var(--line-2);text-align:center;font-size:11.5px;color:var(--ink-3);background:#fff;letter-spacing:.3px;}
    .website .cta-wrap{padding:18px 34px 26px;border-top:none;background:transparent;}
    .single-wrap{max-width:1040px;width:100%;}
    .side-col{width:480px;max-width:92vw;}
    .side-col .site-header,.side-col .stepper,.side-col .site-main,.side-col .website .cta-wrap,.side-col .site-footer{padding-left:18px;padding-right:18px;}
    .side-col .hero-photo{max-width:200px;height:180px;}

    /* product imagery */
    .hero-photo{width:100%;max-width:340px;height:300px;object-fit:cover;border-radius:16px;display:block;margin:0 auto 22px;box-shadow:0 18px 36px rgba(0,0,0,.14);background:#f0ece6;}
    .thumb-row{display:flex;gap:10px;justify-content:center;margin-bottom:22px;}
    .thumb-row img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer;}
    .ci-thumb-photo{width:54px;height:68px;object-fit:cover;border-radius:9px;flex:0 0 auto;background:#f0ece6;}

    /* ---------------- Buttons (shared A/B) ---------------- */
    .btn-primary{
      width:100%;padding:16px;border-radius:12px;border:none;background:var(--accent);color:#fff;
      font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.3px;cursor:pointer;
      transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-primary:active{transform:translateY(1px);background:#000;}
    .btn-ghost{
      padding:10px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:transparent;
      color:#e7e3db;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;
    }
    .btn-ghost:hover{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.06);}
    .btn-ghost.danger{border-color:rgba(214,40,40,.5);color:#f0a0a0;}
    .btn-ghost.danger:hover{background:rgba(214,40,40,.12);}

    /* ---------------- Screen content ---------------- */
    .screen-pad{padding:22px 22px 26px;position:relative;}
    .eyebrow{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px;}
    .p-title{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.15;margin:0 0 4px;}
    .p-size{font-size:13px;color:var(--ink-2);margin-bottom:18px;letter-spacing:.5px;}
    .price-block{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
    .price{font-family:var(--serif);font-size:30px;font-weight:600;}
    .price-sub{font-size:12.5px;color:var(--ink-2);}
    .stock{font-size:12.5px;color:var(--ink-3);margin-bottom:20px;letter-spacing:.3px;}
    .p-desc{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:0 0 18px;}
    .p-meta{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;}
    .p-meta li{font-size:12.5px;color:var(--ink-2);padding-left:18px;position:relative;}
    .p-meta li::before{content:'·';position:absolute;left:4px;color:var(--gold);font-weight:700;font-size:18px;top:-3px;}

    .hero{display:flex;justify-content:center;margin:6px 0 22px;}
    .hero-bottle{width:150px;height:200px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.18));}

    .urgency-banner{
      display:flex;align-items:center;gap:9px;background:var(--danger);color:#fff;
      padding:12px 15px;border-radius:11px;font-size:13.5px;font-weight:600;margin-bottom:18px;
      letter-spacing:.2px;box-shadow:0 6px 18px rgba(214,40,40,.3);
    }
    .urgency-banner b{font-family:var(--mono);font-size:15px;}
    .pulse{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.1s infinite;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7);}70%{box-shadow:0 0 0 9px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}

    .section-h{font-family:var(--serif);font-size:21px;font-weight:600;margin:2px 0 18px;}
    .cart-item{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;background:#fff;}
    .ci-thumb{width:46px;height:58px;flex:0 0 auto;}
    .ci-info{flex:1;}
    .ci-name{font-size:14px;font-weight:600;}
    .ci-sub{font-size:12px;color:var(--ink-3);margin-top:2px;}
    .ci-price{font-size:15px;font-weight:600;}

    .addon{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;cursor:pointer;background:#fff;transition:.12s;}
    .addon:active{background:var(--line-2);}
    .addon.muted{background:transparent;border-color:transparent;border-bottom:1px solid var(--line-2);border-radius:0;padding:12px 2px;}
    .addon.muted .addon-text{color:var(--ink-3);font-size:12px;font-weight:400;}
    .checkbox{width:22px;height:22px;border:1.5px solid var(--ink-3);border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:.12s;}
    .addon.muted .checkbox{border-color:var(--ink-3);width:18px;height:18px;}
    .checkbox.checked{background:var(--ink);border-color:var(--ink);}
    .addon.muted .checkbox.checked{background:var(--ink-3);border-color:var(--ink-3);}
    .checkbox.checked::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);}
    .addon-text{font-size:14px;font-weight:500;flex:1;}
    .addon-price{color:var(--ink-2);font-weight:600;}

    .line{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:11px 0;border-bottom:1px solid var(--line-2);color:var(--ink);}
    .line span:last-child{font-weight:600;}
    .line.muted-line{color:var(--ink-3);font-style:italic;}
    .line.muted-line span:last-child{font-style:normal;font-weight:500;}
    .total-line{border-bottom:none;border-top:1.5px solid var(--ink);margin-top:6px;padding-top:14px;font-size:16px;font-weight:700;}
    .total-line span:last-child{font-family:var(--serif);font-size:20px;}

    .field{display:block;margin-bottom:14px;}
    .field span{display:block;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;}
    .field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:var(--sans);color:var(--ink);background:#fff;}
    .field input:focus{outline:none;border-color:var(--gold);}
    .method{display:flex;align-items:center;justify-content:space-between;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:6px;}
    .method-name{font-size:14px;font-weight:600;}
    .method-sub{font-size:12px;color:var(--ink-3);margin-top:2px;}
    .method-price{font-size:15px;font-weight:700;}

    .pay-method{display:flex;align-items:center;gap:12px;padding:15px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;margin-bottom:18px;}
    .pm-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);flex:0 0 auto;position:relative;}
    .pm-radio.checked::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--ink);}
    .pm-info{flex:1;}
    .pm-name{font-size:14.5px;font-weight:600;}
    .pm-sub{font-size:12px;color:var(--ink-3);margin-top:2px;}
    .pm-badge{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--gold);border:1px solid var(--gold);padding:3px 7px;border-radius:5px;}
    .summary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 16px;}

    .dp-line{color:var(--danger);}
    .dp-line span:last-child{color:var(--danger);}

    /* ---------------- Confirmation ---------------- */
    .confirm{text-align:center;padding-top:40px;}
    .check-circle{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px;}
    .confirm-title{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 8px;}
    .confirm-paid{font-size:15px;color:var(--ink-2);margin-bottom:18px;}
    .confirm-paid b{font-family:var(--serif);font-size:20px;color:var(--ink);}
    .budget-warn{display:inline-block;background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;margin-bottom:18px;}
    .receipt{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin-bottom:16px;}
    .confirm-meta{font-size:12px;color:var(--ink-3);}

    /* ---------------- Dark pattern callouts (inspector only) ---------------- */
    .dp-callout{
      background:rgba(214,40,40,.06);border:1px solid var(--danger-line);border-left:4px solid var(--danger);
      border-radius:9px;padding:11px 13px;margin:14px 0;font-size:12px;line-height:1.5;color:#7a1f1f;
    }
    .dp-tag{font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:var(--danger);text-transform:uppercase;}
    .dp-title{font-size:13px;font-weight:700;color:#9c1c1c;margin:3px 0 2px;}
    .dp-desc{color:#8a3a3a;}

    /* ---------------- Telemetry ---------------- */
    .telemetry{max-width:1180px;margin:26px auto;padding:0 22px 60px;width:100%;}
    .tele-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
    .tele-head h2{font-family:var(--serif);font-size:26px;font-weight:600;color:#f1ede6;margin:0 0 4px;}
    .tele-sub{font-size:13px;color:#9aa0aa;margin:0;max-width:560px;line-height:1.5;}
    .tele-actions{display:flex;gap:10px;}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:18px 20px;}
    .card-v{font-family:var(--serif);font-size:30px;font-weight:600;color:#f4f0e9;}
    .card-l{font-size:11.5px;color:#9aa0aa;letter-spacing:.4px;margin-top:4px;text-transform:uppercase;}
    .card-warn{border-color:rgba(214,40,40,.5);background:rgba(214,40,40,.1);}
    .card-warn .card-v{color:#f3a5a5;}
    .table-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:13px;overflow:hidden;}
    .tele-table{width:100%;border-collapse:collapse;font-size:13px;}
    .tele-table th{text-align:left;padding:13px 16px;background:rgba(0,0,0,.3);color:#b9bec7;font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08);}
    .tele-table td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);color:#dfe3e9;vertical-align:top;}
    .tele-table tr:last-child td{border-bottom:none;}
    .tele-table tbody tr:hover{background:rgba(255,255,255,.03);}
    .grp{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;}
    .grp-A{background:rgba(169,133,79,.25);color:#e9cfa6;}
    .grp-B{background:rgba(214,40,40,.22);color:#f0a8a8;}
    .empty{text-align:center;color:#8b9099;padding:40px;font-style:italic;}

    /* ---------------- Blind mode ---------------- */
    .blind-stage{padding-top:60px;}
    .blind-exit-wrap{position:fixed;top:14px;right:16px;z-index:60;}
    .blind-exit{
      background:rgba(0,0,0,.4);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);
      font-size:11.5px;letter-spacing:.5px;padding:7px 13px;border-radius:20px;cursor:pointer;transition:.15s;backdrop-filter:blur(4px);
    }
    .blind-exit:hover{background:rgba(0,0,0,.7);color:#fff;}
  </style>

<body>
  <div id="app"></div>

  <script>
  (function(){
    "use strict";

    /* ============================ CONFIG ============================ */
    var CONFIG = {
      product: { name: 'Pocket Perfume Roll-On', size: '6 ml' },
      price: 120,
      deliveryFee: 50,
      giftBoxFee: 80,
      platformFee: 25,
      budget: 200,
      urgencyStart: 170, // 02:50
      customer: {
        name: 'Tanvir Ahmed',
        address: 'House 14, Road 7, Dhanmondi, Dhaka',
        phone: '01711-000000'
      }
    };

    var BOTTLE_SVG = '<svg viewBox="0 0 120 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">'
      + '<rect x="46" y="6" width="28" height="22" rx="3" fill="#15110d"/>'
      + '<rect x="40" y="28" width="40" height="13" rx="3" fill="#2a2622"/>'
      + '<rect x="26" y="42" width="68" height="142" rx="18" fill="#15110d"/>'
      + '<rect x="38" y="86" width="44" height="64" rx="5" fill="#fbfaf8"/>'
      + '<text x="60" y="112" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="17" fill="#15110d">AN</text>'
      + '<text x="60" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" letter-spacing="2.5" fill="#a9854f">NOIR</text>'
      + '</svg>';

    var IMG = {
      hero: 'https://www.designarena.ai/u/042f2a76-1d0e-4ff9-bc2f-eb5ae7dc8c0d',
      alt1: 'https://www.designarena.ai/u/eb2cc76b-4481-4981-83c2-329655ce78c9',
      alt2: 'https://www.designarena.ai/u/a2926828-7ef3-41c9-aab5-d8fc0fad893c'
    };

    /* ============================ STATE ============================ */
    var telemetry = [];
    var sessions = {};
    var view = 'A';        // 'A' | 'B' | 'side' | 'telemetry'
    var blind = false;
    var inspectorOn = true;

    /* ============================ HELPERS ============================ */
    function fmt(n){ return '৳' + n; }
    function formatTime(sec){
      var m = Math.floor(sec/60), s = sec%60;
      return (m<10?'0':'') + m + ':' + (s<10?'0':'') + s;
    }
    function esc(str){
      return String(str).replace(/[&<>"]/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
      });
    }
    function uid(){ return 's' + Math.random().toString(36).slice(2,8); }

    function log(s, screen, action, detail){
      telemetry.push({ t: new Date().toISOString(), group: s.prototype, screen: screen, action: action, detail: detail });
    }

    function createSession(prototype){
      return {
        id: uid(),
        prototype: prototype,
        screen: 1,
        giftBox: prototype === 'B',
        customer: { name: CONFIG.customer.name, address: CONFIG.customer.address, phone: CONFIG.customer.phone },
        urgency: CONFIG.urgencyStart,
        startedAt: Date.now()
      };
    }
    function ensureSession(p){
      if(!sessions[p]){
        sessions[p] = createSession(p);
        log(sessions[p], 1, 'session_start', 'Prototype ' + p + ' session started');
        log(sessions[p], 1, 'screen_view', 'Viewed screen 1');
      }
      return sessions[p];
    }
    function go(s, screen){
      if(s.screen !== screen){
        s.screen = screen;
        log(s, screen, 'screen_view', 'Viewed screen ' + screen);
      }
      render();
    }
    function startNewSession(s){
      s.screen = 1;
      s.giftBox = s.prototype === 'B';
      s.customer = { name: CONFIG.customer.name, address: CONFIG.customer.address, phone: CONFIG.customer.phone };
      s.urgency = CONFIG.urgencyStart;
      s.startedAt = Date.now();
      log(s, 1, 'session_start', 'New session started');
      log(s, 1, 'screen_view', 'Viewed screen 1');
      render();
    }
    function totals(s){
      var item = CONFIG.price;
      var gift = s.giftBox ? CONFIG.giftBoxFee : 0;
      var delivery = CONFIG.deliveryFee;
      var platform = s.prototype === 'B' ? CONFIG.platformFee : 0;
      return { item: item, gift: gift, delivery: delivery, platform: platform, total: item + gift + delivery + platform };
    }

    /* ============================ SCREENS ============================ */
    function callout(n, title, desc){
      return '<div class="dp-callout">'
        + '<div class="dp-tag">Dark Pattern ' + n + '</div>'
        + '<div class="dp-title">' + title + '</div>'
        + '<div class="dp-desc">' + desc + '</div></div>';
    }

    function productA(s){
      return '<div class="screen-pad">'
        + '<img class="hero-photo" src="' + IMG.hero + '" alt="SooveŔ Pocket Perfume Roll-On" />'
        + '<div class="thumb-row"><img src="' + IMG.alt1 + '" alt="SooveŔ alternate view" /><img src="' + IMG.alt2 + '" alt="SooveŔ alternate view" /></div>'
        + '<div class="eyebrow">SooveŔ · Eau de Parfum</div>'
        + '<h1 class="p-title">' + CONFIG.product.name + '</h1>'
        + '<div class="p-size">' + CONFIG.product.size + ' · Travel Size</div>'
        + '<div class="price-block"><span class="price">' + fmt(CONFIG.price) + '</span>'
        + '<span class="price-sub">(+' + fmt(CONFIG.deliveryFee) + ' Inside Dhaka delivery)</span></div>'
        + '<div class="stock">In Stock — Ships in 24h</div>'
        + '<p class="p-desc">A discreet, roll-on fragrance crafted for the modern minimalist. Warm amber and white musk, sized to slip into any pocket.</p>'
        + '<ul class="p-meta"><li>Long-lasting · 8hr wear</li><li>Cruelty-free · Vegan formula</li><li>Made in Dhaka</li></ul>'
        + '</div>';
    }

    function productB(s){
      var c = inspectorOn ? callout(1, 'Fake Urgency', 'A red, live countdown with "Only 2 left" manufactures time pressure to push an immediate purchase.') : '';
      return '<div class="screen-pad">'
        + '<div class="urgency-banner"><span class="pulse"></span>Only <b id="urgency-' + s.id + '">' + formatTime(s.urgency) + '</b> left until the offer ends!</div>'
        + c
        + '<img class="hero-photo" src="' + IMG.hero + '" alt="SooveŔ Pocket Perfume Roll-On" />'
        + '<div class="thumb-row"><img src="' + IMG.alt1 + '" alt="SooveŔ alternate view" /><img src="' + IMG.alt2 + '" alt="SooveŔ alternate view" /></div>'
        + '<div class="eyebrow">SooveŔ · Eau de Parfum</div>'
        + '<h1 class="p-title">' + CONFIG.product.name + '</h1>'
        + '<div class="p-size">' + CONFIG.product.size + ' · Travel Size</div>'
        + '<div class="price-block"><span class="price">' + fmt(CONFIG.price) + '</span></div>'
        + '<p class="p-desc">A discreet, roll-on fragrance crafted for the modern minimalist. Warm amber and white musk, sized to slip into any pocket.</p>'
        + '<ul class="p-meta"><li>Long-lasting · 8hr wear</li><li>Cruelty-free · Vegan formula</li><li>Made in Dhaka</li></ul>'
        + '</div>';
    }

    function cart(s){
      var t = totals(s);
      var muted = s.prototype === 'B';
      var line = muted ? (CONFIG.price + (s.giftBox ? CONFIG.giftBoxFee : 0)) : t.total;
      var deliveryRow = muted
        ? '<div class="line muted-line"><span>Delivery</span><span>Calculated at next step</span></div>'
        : '<div class="line"><span>Inside Dhaka Delivery</span><span>' + fmt(CONFIG.deliveryFee) + '</span></div>';
      var totalLabel = muted ? 'Subtotal' : 'Total';
      var c = (inspectorOn && muted) ? callout(2, 'Sneak into Basket', 'The add-on is pre-checked in small, low-contrast text, quietly inflating the price before the buyer notices.') : '';
      return '<div class="screen-pad">'
        + '<div class="section-h">Your Cart</div>'
        + '<div class="cart-item"><div class="ci-thumb-photo"><img src="' + IMG.hero + '" alt="SooveŔ" style="width:100%;height:100%;object-fit:cover;border-radius:9px;" /></div>'
        + '<div class="ci-info"><div class="ci-name">' + CONFIG.product.name + '</div><div class="ci-sub">' + CONFIG.product.size + ' · Qty 1</div></div>'
        + '<div class="ci-price">' + fmt(CONFIG.price) + '</div></div>'
        + '<div class="addon ' + (muted ? 'muted' : '') + '" data-action="toggleGiftBox">'
        + '<div class="checkbox ' + (s.giftBox ? 'checked' : '') + '"></div>'
        + '<div class="addon-text">Gift Box &amp; Bubble Wrap <span class="addon-price">(+' + fmt(CONFIG.giftBoxFee) + ')</span></div></div>'
        + c
        + deliveryRow
        + '<div class="line total-line"><span>' + totalLabel + '</span><span>' + fmt(line) + '</span></div>'
        + '</div>';
    }

    function delivery(s){
      return '<div class="screen-pad">'
        + '<div class="section-h">Delivery Information</div>'
        + '<label class="field"><span>Full Name</span><input data-field="name" value="' + esc(s.customer.name) + '" /></label>'
        + '<label class="field"><span>Address</span><input data-field="address" value="' + esc(s.customer.address) + '" /></label>'
        + '<label class="field"><span>Phone</span><input data-field="phone" value="' + esc(s.customer.phone) + '" /></label>'
        + '<div class="method"><div class="pm-info"><div class="method-name">Inside Dhaka Standard Delivery</div><div class="method-sub">Estimated 1–2 business days</div></div>'
        + '<div class="method-price">' + fmt(CONFIG.deliveryFee) + '</div></div>'
        + '</div>';
    }

    function payment(s){
      var t = totals(s);
      var giftLine = s.giftBox ? '<div class="line"><span>Gift Box &amp; Bubble Wrap</span><span>' + fmt(CONFIG.giftBoxFee) + '</span></div>' : '';
      var platformHtml = '';
      if(s.prototype === 'B'){
        var c = inspectorOn ? callout(3, 'Drip Pricing', 'A new "Service Charge" appears only at checkout — after the buyer is already committed to buying.') : '';
        platformHtml = c + '<div class="line dp-line"><span>Service Charge</span><span>' + fmt(CONFIG.platformFee) + '</span></div>';
      }
      return '<div class="screen-pad">'
        + '<div class="section-h">Payment &amp; Review</div>'
        + '<div class="pay-method"><div class="pm-radio checked"></div>'
        + '<div class="pm-info"><div class="pm-name">bKash / Nagad</div><div class="pm-sub">Mobile wallet · Instant</div></div>'
        + '<div class="pm-badge">SELECTED</div></div>'
        + '<div class="summary">'
        + '<div class="line"><span>' + CONFIG.product.name + '</span><span>' + fmt(CONFIG.price) + '</span></div>'
        + giftLine
        + '<div class="line"><span>Inside Dhaka Delivery</span><span>' + fmt(CONFIG.deliveryFee) + '</span></div>'
        + platformHtml
        + '<div class="line total-line"><span>Total</span><span>' + fmt(t.total) + '</span></div>'
        + '</div></div>';
    }

    function confirmation(s){
      var t = totals(s);
      var exceeded = t.total > CONFIG.budget;
      var giftLine = s.giftBox ? '<div class="line"><span>Gift Box &amp; Bubble Wrap</span><span>' + fmt(CONFIG.giftBoxFee) + '</span></div>' : '';
      var platformLine = s.prototype === 'B' ? '<div class="line"><span>Service Charge</span><span>' + fmt(CONFIG.platformFee) + '</span></div>' : '';
      var warn = (inspectorOn && exceeded) ? '<div class="budget-warn">⚠ Budget Exceeded — ' + fmt(CONFIG.budget) + ' limit</div>' : '';
      return '<div class="screen-pad confirm">'
        + '<div class="check-circle">✓</div>'
        + '<h2 class="confirm-title">Order Confirmed!</h2>'
        + '<div class="confirm-paid">Total Paid: <b>' + fmt(t.total) + '</b></div>'
        + warn
        + '<div class="receipt">'
        + '<div class="line"><span>' + CONFIG.product.name + ' (' + CONFIG.product.size + ')</span><span>' + fmt(CONFIG.price) + '</span></div>'
        + giftLine
        + '<div class="line"><span>Inside Dhaka Delivery</span><span>' + fmt(CONFIG.deliveryFee) + '</span></div>'
        + platformLine
        + '<div class="line total-line"><span>Amount Charged</span><span>' + fmt(t.total) + '</span></div>'
        + '</div>'
        + '<div class="confirm-meta">Order #SOVEŔ-' + s.id.toUpperCase().slice(0,6) + ' · ' + esc(s.customer.name) + '</div>'
        + '</div>';
    }

    function screenHTML(s){
      switch(s.screen){
        case 1: return s.prototype === 'A' ? productA(s) : productB(s);
        case 2: return cart(s);
        case 3: return delivery(s);
        case 4: return payment(s);
        case 5: return confirmation(s);
      }
      return '';
    }

    /* ============================ WEBSITE ============================ */
    function siteHeader(){
      return '<header class="site-header">'
        + '<div class="site-brand"><div class="site-logo">SO</div><div class="site-name">SOOVEŔ</div></div>'
        + '<nav class="site-nav"><a>Shop</a><a>About</a><a>Journal</a><span class="site-cart">🛒 Cart</span></nav>'
        + '</header>';
    }
    function stepper(s){
      var steps = [{n:1,t:'Product'},{n:2,t:'Cart'},{n:3,t:'Delivery'},{n:4,t:'Payment'},{n:5,t:'Done'}];
      return '<div class="stepper">' + steps.map(function(st){
        var cls = st.n === s.screen ? 'step active' : (st.n < s.screen ? 'step done' : 'step');
        var line = st.n < 5 ? '<span class="step-line"></span>' : '';
        return '<div class="' + cls + '"><span class="num">' + st.n + '</span>' + st.t + '</div>' + line;
      }).join('') + '</div>';
    }
    function cta(s){
      var labels = { 1:'Add to Cart', 2:'Proceed to Checkout', 3:'Continue to Payment', 4:'Complete Order (' + fmt(totals(s).total) + ')', 5:'Start New Session' };
      var acts = { 1:'addToCart', 2:'proceedCheckout', 3:'continuePayment', 4:'completeOrder', 5:'startNewSession' };
      return '<div class="cta-wrap"><button class="btn-primary" data-action="' + acts[s.screen] + '">' + labels[s.screen] + '</button></div>';
    }
    function website(s){
      return '<div class="website" data-session="' + s.prototype + '">'
        + siteHeader()
        + stepper(s)
        + '<div class="site-main">' + screenHTML(s) + '</div>'
        + cta(s)
        + '<footer class="site-footer">© SooveŔ — Crafted in Dhaka · Secure checkout via bKash &amp; Nagad</footer>'
        + '</div>';
    }
    function caption(s){
      return '<div class="phone-caption">Prototype <b>' + s.prototype + '</b> — ' + (s.prototype==='A'?'Control':'Dark Patterns')
        + ' · Screen <b>' + s.screen + '</b> · Live Total <b>' + fmt(totals(s).total) + '</b></div>';
    }

    /* ============================ LAYOUTS ============================ */
    function taskBanner(){
      return '<div class="task-banner"><span class="task-tag">Task Scenario</span>'
        + '<span class="task-text">You have a strict budget of ' + fmt(CONFIG.budget)
        + '. Purchase the Pocket Perfume Roll-On (6ml) and complete checkout without exceeding ' + fmt(CONFIG.budget) + '.</span></div>';
    }

    function stageHTML(){
      if(view === 'telemetry') return telemetryHTML();
      if(view === 'side'){
        var a = ensureSession('A'), b = ensureSession('B');
        return '<div class="side-wrap">'
          + '<div class="side-col"><div class="side-label">Prototype A — Control</div>' + website(a) + caption(a) + '</div>'
          + '<div class="side-col"><div class="side-label b">Prototype B — Dark Patterns</div>' + website(b) + caption(b) + '</div>'
          + '</div>';
      }
      var s = ensureSession(view === 'B' ? 'B' : 'A');
      return '<div class="single-wrap"><div class="side-col">' + website(s) + caption(s) + '</div></div>';
    }

    function researcherLayout(){
      return ''
        + '<header class="toolbar">'
        + '<div class="brand"><div class="brand-mark">SO</div>'
        + '<div class="brand-text"><div class="brand-name">SOOVEŔ</div><div class="brand-sub">HCI Dark Patterns Lab</div></div></div>'
        + '<nav class="tabs">'
        + '<button class="tab ' + (view==='A'?'active':'') + '" data-view="A">Prototype A (Control)</button>'
        + '<button class="tab ' + (view==='B'?'active':'') + '" data-view="B">Prototype B (Dark Patterns)</button>'
        + '<button class="tab ' + (view==='side'?'active':'') + '" data-view="side">Side-by-Side View</button>'
        + '<button class="tab ' + (view==='telemetry'?'active':'') + '" data-view="telemetry">Researcher Telemetry Log</button>'
        + '</nav>'
        + '<div class="inspector"><span class="inspector-label">Inspector</span>'
        + '<button class="switch ' + (inspectorOn?'on':'') + '" data-action="toggleInspector"><span class="knob"></span></button>'
        + '<span class="inspector-state">' + (inspectorOn?'ON':'OFF') + '</span></div>'
        + '</header>'
        + (inspectorOn && view !== 'telemetry' ? taskBanner() : '')
        + '<main class="stage">' + stageHTML() + '</main>';
    }

    function blindLayout(){
      var s = ensureSession(view === 'B' ? 'B' : 'A');
      return '<div class="blind-exit-wrap"><button class="blind-exit" data-action="exitBlind">Exit Participant Mode ↗</button></div>'
        + '<main class="stage blind-stage"><div class="single-wrap"><div class="side-col">' + website(s) + '</div></div></main>';
    }

    /* ============================ TELEMETRY ============================ */
    function telemetryHTML(){
      var comps = telemetry.filter(function(e){ return e.action === 'complete_order'; });
      var exceeded = comps.filter(function(e){ return e.detail.indexOf('EXCEEDED') > -1; }).length;
      var sessionsCount = telemetry.filter(function(e){ return e.action === 'session_start'; }).length;
      var aComp = comps.filter(function(e){ return e.group === 'A'; });
      var bComp = comps.filter(function(e){ return e.group === 'B'; });
      function avg(arr){
        if(!arr.length) return '—';
        var sum = arr.reduce(function(a,e){
          var m = e.detail.match(/Final=৳(\d+)/); return a + (m ? parseInt(m[1],10) : 0);
        },0);
        return fmt(Math.round(sum/arr.length));
      }
      var rows = telemetry.slice().reverse().map(function(e){
        return '<tr><td class="mono">' + e.t + '</td>'
          + '<td><span class="grp grp-' + e.group + '">' + e.group + '</span></td>'
          + '<td>' + e.screen + '</td>'
          + '<td class="mono">' + e.action + '</td>'
          + '<td>' + esc(e.detail) + '</td></tr>';
      }).join('');
      return '<div class="telemetry">'
        + '<div class="tele-head"><div><h2>Researcher Telemetry Log</h2>'
        + '<p class="tele-sub">All participant interactions are recorded client-side for this study session. Export the full event stream as CSV for analysis.</p></div>'
        + '<div class="tele-actions"><button class="btn-ghost" data-action="exportCsv">⬇ Export CSV</button>'
        + '<button class="btn-ghost danger" data-action="clearLog">Clear Log</button></div></div>'
        + '<div class="cards">'
        + '<div class="card"><div class="card-v">' + sessionsCount + '</div><div class="card-l">Sessions</div></div>'
        + '<div class="card"><div class="card-v">' + comps.length + '</div><div class="card-l">Completed Orders</div></div>'
        + '<div class="card ' + (exceeded?'card-warn':'') + '"><div class="card-v">' + exceeded + '</div><div class="card-l">Budget Exceeded (&gt;' + fmt(CONFIG.budget) + ')</div></div>'
        + '<div class="card"><div class="card-v">' + avg(aComp) + '</div><div class="card-l">Avg Total · A</div></div>'
        + '<div class="card"><div class="card-v">' + avg(bComp) + '</div><div class="card-l">Avg Total · B</div></div>'
        + '</div>'
        + '<div class="table-wrap"><table class="tele-table"><thead><tr>'
        + '<th>Timestamp</th><th>Group</th><th>Screen</th><th>Event</th><th>Detail</th></tr></thead><tbody>'
        + (rows || '<tr><td colspan="5" class="empty">No events recorded yet. Run a participant session to populate this log.</td></tr>')
        + '</tbody></table></div></div>';
    }

    function csvCell(v){
      v = String(v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
    }
    function exportCsv(){
      var header = ['Timestamp','Group','Screen','Event','Detail'];
      var lines = [header].concat(telemetry.map(function(e){ return [e.t,e.group,e.screen,e.action,e.detail]; }));
      var csv = lines.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
      var blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'atelier-noir-telemetry.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    /* ============================ ACTIONS ============================ */
    function handleAction(action, el){
      var p = el.closest('[data-session]') ? el.closest('[data-session]').dataset.session : null;
      var s = p ? sessions[p] : null;
      switch(action){
        case 'toggleInspector':
          blind = !blind; inspectorOn = !blind;
          if(blind && view !== 'A' && view !== 'B') view = 'A';
          render(); break;
        case 'exitBlind':
          blind = false; inspectorOn = true; render(); break;
        case 'exportCsv': exportCsv(); break;
        case 'clearLog': telemetry.length = 0; render(); break;
        case 'addToCart':
          if(s){ log(s,1,'add_to_cart','Added ' + CONFIG.product.name + ' to cart'); go(s,2); } break;
        case 'toggleGiftBox':
          if(s){ s.giftBox = !s.giftBox; log(s, s.screen, 'gift_box_toggle', 'Gift Box = ' + (s.giftBox?'ON':'OFF')); render(); } break;
        case 'proceedCheckout':
          if(s){ log(s,2,'proceed_checkout','Gift Box = ' + (s.giftBox?'ON':'OFF') + '; Subtotal = ' + fmt(CONFIG.price + (s.giftBox?CONFIG.giftBoxFee:0))); go(s,3); } break;
        case 'continuePayment':
          if(s){ log(s,3,'continue_payment','Delivery details confirmed'); go(s,4); } break;
        case 'completeOrder':
          if(s){ var t = totals(s); log(s,4,'complete_order','Final = ' + fmt(t.total) + '; Budget = ' + (t.total>CONFIG.budget?'EXCEEDED':'WITHIN')); go(s,5); } break;
        case 'startNewSession':
          if(s){ startNewSession(s); } break;
        case 'back':
          if(s){ go(s, Math.max(1, s.screen - 1)); } break;
      }
    }

    /* ============================ RENDER ============================ */
    function render(){
      var app = document.getElementById('app');
      app.innerHTML = blind ? blindLayout() : researcherLayout();
    }

    /* ============================ INIT ============================ */
    function init(){
      var params = new URLSearchParams(window.location.search);
      var blindParam = params.get('blind') === '1';
      var groupParam = (params.get('group') || 'A').toUpperCase();
      view = (groupParam === 'A' || groupParam === 'B') ? groupParam : 'A';
      blind = blindParam;
      inspectorOn = !blind;

      document.addEventListener('click', function(e){
        var a = e.target.closest('[data-action]');
        if(a){ handleAction(a.dataset.action, a); return; }
        var v = e.target.closest('[data-view]');
        if(v){ view = v.dataset.view; render(); }
      });
      document.addEventListener('input', function(e){
        var f = e.target.closest('[data-field]');
        if(!f) return;
        var p = f.closest('[data-session]') ? f.closest('[data-session]').dataset.session : null;
        var s = p ? sessions[p] : null;
        if(s) s.customer[f.dataset.field] = f.value;
      });

      // Live countdown ticker for Prototype B urgency banners
      setInterval(function(){
        Object.keys(sessions).forEach(function(k){
          var s = sessions[k];
          if(s.prototype === 'B'){
            s.urgency = s.urgency > 0 ? s.urgency - 1 : CONFIG.urgencyStart;
            var el = document.getElementById('urgency-' + s.id);
            if(el) el.textContent = formatTime(s.urgency);
          }
        });
      }, 1000);

      render();
    }

    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', init);
    } else { init(); }
  })();
  </script>
</body>
</html>
